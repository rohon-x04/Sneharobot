services:
  - type: web
    name: sneha-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: FIREBASE_URL
        sync: false
      - key: FIREBASE_SECRET
        sync: false
      - key: OWNER_ID
        sync: false
